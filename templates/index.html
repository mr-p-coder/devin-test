<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Current Weather</title>
  <style>
    body { font-family: system-ui, Arial; padding: 1.5rem; max-width: 720px; margin: auto; }
    #card { border: 1px solid #ddd; padding: 1rem; border-radius: 8px; margin-top: 1rem; }
    .muted { color: #666; font-size: 0.9rem; }
    input { padding: 0.5rem; font-size: 1rem; }
    button { padding: 0.5rem 1rem; font-size: 1rem; }
  </style>
</head>
<body>
  <h1>Current Weather</h1>
  <p class="muted">Enter a ZIP/postal code to get the current weather for that area.</p>

  <label for="zip">ZIP / Postal code:</label>
  <input id="zip" name="zip" type="text" placeholder="e.g. 94103 or SW1A 1AA" />
  <button id="getWeather">Get weather</button>
  <div id="status"></div>

  <div id="card" hidden>
    <h2 id="place"></h2>
    <img id="icon" alt="" />
    <p id="desc"></p>
    <p><strong>Temperature:</strong> <span id="temp"></span> °C</p>
    <p><strong>Feels like:</strong> <span id="feels"></span> °C</p>
  </div>

  <script>
    const status = document.getElementById('status');
    const card = document.getElementById('card');
    document.getElementById('getWeather').addEventListener('click', async () => {
      card.hidden = true;
      status.textContent = '';
      const zip = document.getElementById('zip').value.trim();
      if (!zip) {
        status.textContent = 'Please enter a ZIP or postal code.';
        return;
      }
      status.textContent = 'Fetching weather…';
      try {
        // Pass zip exactly as entered. For OpenWeather, you can add ",<country_code>" if needed (e.g. "94103,us").
        const resp = await fetch(`/weather?zip=${encodeURIComponent(zip)}`);
        if (!resp.ok) {
          const err = await resp.json().catch(()=>({error:resp.statusText}));
          status.textContent = 'Error: ' + (err.error || resp.statusText);
          return;
        }
        const data = await resp.json();
        status.textContent = '';
        document.getElementById('place').textContent = data.name || 'Location';
        document.getElementById('desc').textContent = data.description || '';
        document.getElementById('temp').textContent = data.temp;
        document.getElementById('feels').textContent = data.feels_like;
        document.getElementById('icon').src = data.icon ? `https://openweathermap.org/img/wn/${data.icon}@2x.png` : '';
        card.hidden = false;
      } catch (e) {
        status.textContent = 'Network error: ' + e.message;
      }
    });
  </script>
</body>
</html>
